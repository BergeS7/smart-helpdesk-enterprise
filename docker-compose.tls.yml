# Responsabilidade: adiciona publicação HTTP/HTTPS com certificado real à stack principal.
services:
  frontend:
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Defina TLS_CERT_PATH no .env}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Defina TLS_KEY_PATH no .env}:/etc/nginx/tls/privkey.pem:ro
